<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Radar Internacional</title>
  <meta name="description" content="Noticias de medios internacionales sobre mercado de capitales, tecnología e IA y geopolítica, con foco en África y Medio Oriente.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='none' stroke='%232a5bd7' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%232a5bd7'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <h1>Radar Internacional</h1>
      <p class="updated" id="updated">Cargando…</p>
    </div>
    <button class="status-btn" id="status-btn" type="button" aria-controls="status" aria-expanded="false">Estado de fuentes</button>
  </header>

  <section class="status" id="status" hidden></section>

  <form class="filters" id="filters" role="search" onsubmit="return false">
    <input type="search" id="q" placeholder="Buscar en títulos y resúmenes" aria-label="Buscar">
    <select id="lang" aria-label="Idioma original">
      <option value="">Todos los idiomas</option>
      <option value="es">Español</option>
      <option value="en">Inglés</option>
      <option value="ar">Árabe</option>
      <option value="he">Hebreo</option>
      <option value="de">Alemán</option>
      <option value="fr">Francés</option>
      <option value="hi">Hindi</option>
      <option value="bn">Bengalí</option>
      <option value="zh">Chino</option>
      <option value="ja">Japonés</option>
      <option value="am">Amhárico</option>
    </select>
    <select id="source" aria-label="Medio"><option value="">Todos los medios</option></select>
    <select id="period" aria-label="Período">
      <option value="12">Últimas 12 h</option>
      <option value="24" selected>Últimas 24 h</option>
      <option value="72">Últimos 3 días</option>
      <option value="168">Últimos 7 días</option>
    </select>
    <div class="chips" id="topics" role="group" aria-label="Temas"></div>
  </form>

  <nav class="tabs" id="tabs" aria-label="Secciones"></nav>
  <main class="board" id="board"></main>

  <footer class="foot">
    Titulares y resúmenes de los feeds RSS públicos de cada medio. Las noticias en otros idiomas se traducen
    automáticamente al español con Argos Translate (y con MyMemory las del amhárico).
    <a href="https://github.com/ohmychich/gz-radar-internacional">Código fuente</a>
  </footer>

  <script src="app.js"></script>
</body>
</html>
