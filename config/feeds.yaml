# Fuentes del radar. Para sumar un medio, agregá un bloque nuevo.
#
#   id:     identificador corto, sin espacios
#   name:   nombre que se muestra en el dashboard
#   lang:   idioma original (es, en, ar, he, de, fr). ar/he/de/fr se traducen al español
#   topic:  (opcional) tema por defecto si el feed es temático: mercados | tech | geopolitica
#   region: (opcional) región por defecto: africa | medio_oriente
#   urls:   uno o más feeds RSS/Atom del medio

