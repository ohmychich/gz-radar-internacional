# Reglas de clasificación. Se aplican sobre el título y el resumen originales
# y también sobre su traducción al español.
#
# Sintaxis de cada palabra clave:
#   palabra      coincide con la palabra completa, sin distinguir mayúsculas
#   palabra*     coincide con cualquier palabra que empiece así (bond* → bonds, bondholders)
#   =AI          distingue mayúsculas (para siglas que chocan con palabras comunes)
#   En árabe y hebreo se busca el texto tal cual, porque los prefijos van pegados.
#
# Cada noticia va a una sola columna: la que suma más coincidencias.

topics:
  mercados:
    label: Mercado de capitales
    keywords:
      en: [IPO*, initial public offering, listing, bond*, eurobond*, sovereign debt, debt restructuring,
           "=M&A", merger*, acquisition*, takeover*, buyout*, private equity, venture capital, hedge fund*,
           asset manager*, central bank*, Federal Reserve, "=Fed", "=ECB", interest rate*, rate cut*, rate hike*,
           monetary policy, inflation, "=SEC", stock exchange*, bourse, sovereign wealth fund*, "=IMF",
           World Bank, credit rating*, Moody's, Fitch, downgrade*, earnings, dividend*, buyback*,
           capital market*, investor*, sukuk, fundraising, valuation, bank*, banking, debt, yields]
      es: [salida a bolsa, "=OPV", emisión de bonos, bono*, deuda soberana, deuda, fusión, fusiones, adquisición*,
           banco central, Reserva Federal, tipos de interés, tasas de interés, tasa de interés, política monetaria,
           inflación, fondo soberano, "=FMI", Banco Mundial, calificación crediticia, bolsa de valores,
           mercado de capitales, mercados financieros, inversor*, inversionista*, capital de riesgo, banca, banco*]
      fr: [introduction en bourse, obligation*, dette*, fusion*, acquisition*, rachat*, banque centrale,
           "=BCE", taux d'intérêt, taux directeur*, politique monétaire, inflation, fonds souverain*, "=FMI",
           Banque mondiale, notation, marchés financiers, investisseur*, levée de fonds, banque*]
      de: [Börsengang*, Anleihe*, Staatsanleihe*, Übernahme*, Fusion*, Zentralbank*, "=EZB", Leitzins*,
           Zinsen, Zinssenkung*, Zinserhöhung*, Geldpolitik, Inflation, Staatsfonds, "=IWF", Ratingagentur*,
           Finanzmarkt*, Kapitalmarkt*, Investor*, Anleger*, Bank*, Dividende*, Schulden*]
      ar: [طرح عام, اكتتاب, سندات, صكوك, استحواذ, اندماج, البنك المركزي, المركزي, أسعار الفائدة, الفائدة,
           التضخم, صندوق النقد, البنك الدولي, صندوق سيادي, صناديق سيادية, البورصة, سوق الأسهم, سوق المال,
           المستثمرين, تصنيف ائتماني, الديون, مصرف, بنوك]
      he: [הנפקה, אג"ח, איגרות חוב, מיזוג, רכישת, בנק ישראל, הבנק המרכזי, ריבית, אינפלציה, קרן גידור,
           הון סיכון, הבורסה, משקיעים, דירוג אשראי, קרן הון, גיוס, בנקים]
    # Titulares de cotizaciones del día: se descartan si la noticia iba a "mercados".
    # Son expresiones regulares (sin distinguir mayúsculas).
    exclude:
      - '\b(stocks?|shares|equities|futures)\b.{0,40}\b(rise|rises|rose|fall|falls|fell|jump|jumps|slip|slips|drop|drops|gain|gains|tumble|tumbles|surge|surges|rally|rallies|climb|climbs|sink|sinks|edge|edges)\b'
      - '\b(dow|nasdaq|s&p 500|ftse|dax|cac 40|nikkei|stoxx|hang seng|ibex|merval|tasi|egx30)\b.{0,40}\b(rise|rises|fall|falls|close|closes|open|opens|gain|gains|slip|slips|drop|drops|ends|higher|lower|record)\b'
      - 'stock market today'
      - '\bcloses? (at|higher|lower|up|down)\b'
      - '\b(gold|oil|brent|bitcoin|crude) (price|prices)\b'
      - '\b(bolsa|ibex|merval|wall street)\b.{0,40}\b(sube|baja|cierra|abre|avanza|retrocede|cae)\b'
      - '\b(cac 40|bourse de paris|wall street)\b.{0,40}\b(ouvre|termine|recule|progresse|clôture|chute)\b'
      - '\b(dax|börse|aktien|wall street)\b.{0,40}\b(steigt|fällt|schließt|legt zu|gibt nach|im plus|im minus)\b'

