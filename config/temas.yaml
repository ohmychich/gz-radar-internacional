# Reglas de clasificación. Se aplican sobre el título y el resumen originales
# y también sobre su traducción al español.
#
# Cada noticia puede tener varios temas (hasta 3): todos los que tengan al menos
# una coincidencia, ordenados por cantidad de coincidencias.
#
# Sintaxis de cada palabra clave:
#   palabra      coincide con la palabra completa, sin distinguir mayúsculas
#   palabra*     coincide con cualquier palabra que empiece así (bond* → bonds, bondholders)
#   =AI          distingue mayúsculas (para siglas que chocan con palabras comunes)
#   En árabe y hebreo se busca el texto tal cual, porque los prefijos van pegados.

