name: Probar feeds candidatos

# Corre a mano desde Actions. Prueba las URLs de tools/candidatos.txt
# y guarda el resultado en tools/resultado-prueba.txt.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-noticias   # el mismo grupo que el robot, para no pisarse los commits
  cancel-in-progress: false

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install feedparser requests
      - run: python -m tools.probar_feeds tools/candidatos.txt > tools/resultado-prueba.txt
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/resultado-prueba.txt
          git diff --cached --quiet && exit 0
          git commit -m "Resultado de la prueba de feeds"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
