name: Actualizar noticias

on:
  schedule:
    - cron: "17 * * * *"   # una vez por hora, en el minuto 17
  workflow_dispatch:        # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: actualizar-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Guardar modelos de traducción entre corridas
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/argos-translate
            ~/.local/cache/argos-translate
            ~/stanza_resources
          key: argos-modelos-v1
          restore-keys: argos-modelos-

      - name: Instalar dependencias
        run: |
          # PyTorch en versión solo CPU: mucho más liviana que la versión por defecto.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest -q

      - name: Descargar, clasificar y traducir
        run: python -m radar.main

      - name: Guardar datos en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Actualizar noticias $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
